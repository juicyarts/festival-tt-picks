name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy markdown files into site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp sw.js _site/
          cp manifest.json _site/
          cp pages.json _site/
          # copy all markdown directories, preserving structure
          find . -name '*.md' -not -path './.git/*' | while read f; do
            dest="_site/$(dirname "$f" | sed 's|^\./||')"
            mkdir -p "$dest"
            cp "$f" "$dest/"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
