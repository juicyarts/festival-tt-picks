<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=3.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Achja?!">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="manifest" href="manifest.json">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23fff'/><text y='50' font-size='64' text-anchor='middle' x='50' dominant-baseline='central'>✊</text></svg>">
  <title>Achja?!</title>
  <style>
    :root {
      --bg: #faf9f6;
      --card-bg: #fff;
      --text: #1a1a2e;
      --text-muted: #666;
      --border: #e8e4df;
      --accent: #e94560;
      --accent-soft: #fce4e8;
      --link: #2d6a9f;
      --stage-bg: #f0ede8;
      --shadow: 0 1px 3px rgba(0, 0, 0, .06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a2e;
        --card-bg: #222240;
        --text: #e8e4df;
        --text-muted: #999;
        --border: #333355;
        --accent: #ff6b81;
        --accent-soft: #3a1a2e;
        --link: #7cb9e8;
        --stage-bg: #2a2a44;
        --shadow: 0 1px 3px rgba(0, 0, 0, .3);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      padding-bottom: env(safe-area-inset-bottom, 0);
      overflow-x: hidden;
    }

    /* ── header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header .back {
      width: 36px;
      height: 36px;
      border: none;
      background: var(--stage-bg);
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      color: var(--text);
      display: none;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    header .back.visible {
      display: flex;
    }

    header h1 {
      font-size: 1rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── main ── */
    main {
      padding: 12px 16px 32px;
      max-width: 720px;
      margin: 0 auto;
      overflow-x: hidden;
    }

    /* ── listing ── */
    .listing {
      display: none;
    }

    .listing.active {
      display: block;
    }

    .listing h2 {
      font-size: .85rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .card {
      display: block;
      padding: 14px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 8px;
      text-decoration: none;
      color: var(--text);
      box-shadow: var(--shadow);
      transition: transform .15s;
    }

    .card:active {
      transform: scale(.98);
    }

    .card .title {
      font-weight: 600;
      font-size: .95rem;
    }

    .card .meta {
      font-size: .8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* ── content view ── */
    .content {
      display: none;
    }

    .content.active {
      display: block;
    }

    /* ── markdown rendered ── */
    .md {
      font-size: .9rem;
      overflow-x: hidden;
    }

    .md h1 {
      font-size: 1.2rem;
      margin: 0 0 16px;
      line-height: 1.3;
    }

    .md h2 {
      font-size: 1rem;
      margin: 24px 0 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }

    .md h3 {
      font-size: .9rem;
      margin: 16px 0 6px;
    }

    .md p {
      margin: 8px 0;
    }

    .md a {
      color: var(--link);
      text-decoration: none;
    }

    .md a:visited {
      color: var(--link);
    }

    .md hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 20px 0;
    }

    /* ── mobile-friendly tables ── */
    .md .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 8px -16px;
      padding: 0 16px;
      scroll-snap-type: x mandatory;
    }

    .md table {
      width: 100%;
      min-width: 420px;
      border-collapse: collapse;
      font-size: .8rem;
    }

    .md th {
      text-align: left;
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--text-muted);
      padding: 6px 8px;
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
    }

    .md td {
      padding: 8px 8px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .md a {
      word-break: break-all;
    }

    .md tr:last-child td {
      border-bottom: none;
    }

    /* card-style rows on narrow screens */
    @media (max-width: 520px) {
      .md .table-wrap {
        margin: 8px 0;
        padding: 0;
        overflow: hidden;
      }

      .md table,
      .md thead,
      .md tbody,
      .md th,
      .md tr,
      .md td {
        display: block;
        min-width: 0;
      }

      .md thead {
        display: none;
      }

      .md tr {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        margin-bottom: 10px;
        padding: 10px 14px;
        box-shadow: var(--shadow);
      }

      .md td {
        border: none;
        padding: 4px 0;
        display: block;
        font-size: .82rem;
        word-break: break-word;
        overflow-wrap: anywhere;
        min-width: 0;
      }

      .md td,
      .md td * {
        max-width: 100%;
      }

      .md a {
        word-break: break-all;
      }

      .md tr {
        overflow: hidden;
      }

      .md td::before {
        content: attr(data-label);
        display: block;
        font-size: .64rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: .03em;
        color: var(--text-muted);
        margin-bottom: 1px;
      }

      .md td[data-label=""]::before {
        display: none;
      }

      .md td:first-child {
        font-weight: 600;
        font-size: .92rem;
        margin-bottom: 6px;
      }

      .md td:first-child::before {
        display: none;
      }

    }

    .md blockquote {
      border-left: 3px solid var(--accent);
      margin: 12px 0;
      padding: 8px 14px;
      background: var(--accent-soft);
      border-radius: 0 8px 8px 0;
      font-size: .82rem;
      color: var(--text-muted);
    }

    .md code {
      background: var(--stage-bg);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: .82em;
    }

    /* ── loading / offline badge ── */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: .78rem;
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
      z-index: 99;
    }

    .toast.show {
      opacity: 1;
    }

    /* ── tab bar ── */
    .tab-bar {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .tab-bar button {
      flex: 1;
      padding: 10px 4px;
      border: none;
      border-bottom: 2px solid transparent;
      background: none;
      font-size: .8rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: color .15s, border-color .15s;
    }

    .tab-bar button.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ── tab panels ── */
    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    /* ── map ── */
    .map-container {
      position: relative;
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .map-container img {
      width: 100%;
      display: block;
      user-select: none;
      -webkit-user-select: none;
    }

    .map-marker {
      position: absolute;
      transform: translate(-50%, -100%);
      font-size: .8rem;
      pointer-events: auto;
      cursor: pointer;
      z-index: 2;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .4));
    }

    .map-marker .label {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      font-size: .55rem;
      font-weight: 600;
      white-space: nowrap;
      background: var(--card-bg);
      color: var(--text);
      padding: 1px 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-top: 1px;
    }

    .map-toolbar {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .map-toolbar button {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card-bg);
      font-size: .75rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .map-toolbar button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .map-toolbar button.accent {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .map-share-wrap {
      text-align: center;
      margin-top: 10px;
    }

    .map-share-wrap button {
      padding: 8px 20px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card-bg);
      font-size: .78rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .map-help {
      font-size: .7rem;
      color: var(--text-muted);
      margin-top: 8px;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── supermarket ── */
    .supermarket-section { margin-top: 24px; }
    .supermarket-section h3 { font-size: .85rem; margin-bottom: 8px; }
    .supermarket-map {
      width: 100%; border-radius: 10px;
      border: 1px solid var(--border); display: block;
    }
    .supermarket-note { font-size: .7rem; color: var(--text-muted); margin-top: 6px; }

    /* ── notifications ── */
    .notif-md { margin-bottom: 16px; }
    .notif-md ul { list-style: none; padding: 0; }
    .notif-md li {
      padding: 8px 12px; margin-bottom: 6px;
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 8px; font-size: .82rem;
    }
  </style>
</head>

<body>
  <header>
    <button class="back" id="backBtn" aria-label="Back">←</button>
    <h1 id="pageTitle">Achja?!</h1>
  </header>

  <main>
    <div class="listing active" id="listing"></div>
    <div class="content" id="content"></div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    // ── simple SPA router via hash ──
    const $listing = document.getElementById('listing');
    const $content = document.getElementById('content');
    const $backBtn = document.getElementById('backBtn');
    const $title = document.getElementById('pageTitle');
    const $toast = document.getElementById('toast');

    let pages = [];
    let isOnline = navigator.onLine;

    // ── toast ──
    function toast(msg, ms = 2000) {
      $toast.textContent = msg;
      $toast.classList.add('show');
      clearTimeout($toast._t);
      $toast._t = setTimeout(() => $toast.classList.remove('show'), ms);
    }

    // ── load page index ──
    async function loadIndex() {
      try {
        const res = await fetch('pages.json');
        pages = await res.json();
      } catch (e) {
        // fallback: show only if we can't load
        pages = [];
      }
      renderListing();
    }

    function renderListing() {
      $listing.innerHTML = '';
      if (pages.length === 0) {
        $listing.innerHTML = '<p style="color:var(--text-muted)">No festival pages found. Add markdown files to the repo.</p>';
        return;
      }
      const h2 = document.createElement('h2');
      h2.textContent = 'Festivals';
      $listing.appendChild(h2);

      pages.forEach((p, i) => {
        const a = document.createElement('a');
        a.className = 'card';
        a.href = '#' + p.slug;
        a.innerHTML = `<div class="title">${esc(p.title)}</div><div class="meta">${esc(p.date || '')}</div>`;
        $listing.appendChild(a);
      });
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // ── simple markdown → HTML ──
    function md2html(md) {
      let html = md;

      // preprocess: collect table blocks so we don't process pipes inside them weirdly
      // 1. headers (must be before hr)
      html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
      html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
      html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

      // 2. horizontal rules
      html = html.replace(/^---$/gm, '<hr>');

      // 3. blockquotes
      html = html.replace(/^&gt; (.*)$/gm, '<blockquote><p>$1</p></blockquote>');
      // merge consecutive blockquotes
      html = html.replace(/<\/blockquote>\n<blockquote>/g, '\n');

      // 4. inline code
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

      // 5. links
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

      // 6. bold & italic
      html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

      // 7. tables — wrap in div.table-wrap and convert
      html = html.replace(/((?:^\|.+\|$\n?)+)/gm, (match) => {
        const lines = match.trim().split('\n');
        // check for separator line
        let hasHeader = lines.length > 1 && /^\|(\s*:?-+:?\s*\|)+$/.test(lines[1]);
        let headerCells = [];
        let bodyStart = 0;

        if (hasHeader) {
          headerCells = lines[0].split('|').slice(1, -1).map(c => c.trim());
          bodyStart = 2;
        } else {
          bodyStart = 0;
        }

        let tableHtml = '<div class="table-wrap"><table>';
        if (hasHeader) {
          tableHtml += '<thead><tr>';
          headerCells.forEach(c => {tableHtml += `<th>${c}</th>`;});
          tableHtml += '</tr></thead>';
        }

        tableHtml += '<tbody>';
        for (let i = bodyStart; i < lines.length; i++) {
          const cells = lines[i].split('|').slice(1, -1).map(c => c.trim());
          if (cells.length === 0 || cells.every(c => c === '')) continue;
          tableHtml += '<tr>';
          cells.forEach((c, ci) => {
            const label = hasHeader && headerCells[ci] ? headerCells[ci] : '';
            tableHtml += `<td data-label="${escAttr(label)}">${c}</td>`;
          });
          tableHtml += '</tr>';
        }
        tableHtml += '</tbody></table></div>';
        return tableHtml;
      });

      // 8. paragraphs — wrap remaining text lines in <p>
      // split by double newlines, then process
      const blocks = html.split(/\n\n+/);
      html = blocks.map(block => {
        block = block.trim();
        if (!block) return '';
        // skip blocks that are already html tags
        if (/^<(h[1-4]|hr|blockquote|div|table|thead|tbody|tr|th|td|ul|ol|li|p|pre|code)/.test(block)) return block;
        // skip single <br> or empty
        if (block === '<br>') return block;
        // wrap in p
        const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
        return '<p>' + lines.join('<br>') + '</p>';
      }).join('\n');

      return html;
    }

    function escAttr(s) {
      return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    let activeTab = null;

    // ── load & render a page ──
    async function loadPage(slug) {
      const page = pages.find(p => p.slug === slug);
      if (!page) {showListing(); return;}

      $listing.classList.remove('active');
      $content.classList.add('active');
      $backBtn.classList.add('visible');
      $title.textContent = page.title;
      $content.innerHTML = '<p style="color:var(--text-muted)">Loading…</p>';

      try {
        const res = await fetch(page.file);
        if (!res.ok) throw new Error('Not found');
        const md = await res.text();
        const html = md2html(md);

        // try loading notifications.md
        let notifHtml = '';
        try {
          const notifPath = slug + '/notifications.md';
          const nres = await fetch(notifPath);
          if (nres.ok) { notifHtmlCache = notifHtml = md2html(await nres.text()); }
        } catch(e) {}

        const defaultTab = activeTab || 'artists';
        $content.innerHTML =
          '<nav class="tab-bar">' +
          '<button class="tab' + (defaultTab === 'artists' ? ' active' : '') + '" data-tab="artists">Artists</button>' +
          '<button class="tab' + (defaultTab === 'locations' ? ' active' : '') + '" data-tab="locations">Locations</button>' +
          '<button class="tab' + (defaultTab === 'notifications' ? ' active' : '') + '" data-tab="notifications">Notifications</button>' +
          '</nav>' +
          '<div class="tab-panel tab-artists' + (defaultTab === 'artists' ? ' active' : '') + '"><div class="md">' + html + '</div></div>' +
          '<div class="tab-panel tab-locations' + (defaultTab === 'locations' ? ' active' : '') + '">' + buildLocationsPanel(page) + '</div>' +
          '<div class="tab-panel tab-notifications' + (defaultTab === 'notifications' ? ' active' : '') + '">' + buildNotificationsPanel(notifHtml) + '</div>';

        wireTabs(slug);
        if (page.map) initMap(slug, page.map);
        initNotifications(slug);
        if (defaultTab === 'artists') scrollToNow();
      } catch (e) {
        $content.innerHTML = '<p style="color:var(--text-muted)">Failed to load page. Check your connection.</p>';
      }
    }

    function showListing() {
      $content.classList.remove('active');
      $listing.classList.add('active');
      $backBtn.classList.remove('visible');
      $title.textContent = 'Achja?!';
      window.location.hash = '';
    }

    // ── routing ──
    function route() {
      const raw = window.location.hash.replace('#', '');
      if (!raw && pages.length > 0) return showListing();
      if (!raw) return;
      const [slug, tab] = raw.split(':');
      activeTab = tab || null;
      if (pages.length > 0) {
        loadPage(slug);
      } else {
        loadIndex().then(() => {if (window.location.hash) route();});
      }
    }

    $backBtn.addEventListener('click', showListing);
    window.addEventListener('hashchange', route);

    // ── scroll to current day ──
    function scrollToNow() {
      // Appletree Garden 2026: July 30 (Thu), 31 (Fri), Aug 1 (Sat)
      const dayMap = {4: 'Thursday', 5: 'Friday', 6: 'Saturday'};
      const today = new Date();
      const target = dayMap[today.getDay()];
      if (!target) return;
      // find the h2 heading matching the target day
      const h2s = document.querySelectorAll('.md h2');
      for (const h of h2s) {
        if (h.textContent.toLowerCase().startsWith(target.toLowerCase())) {
          h.scrollIntoView({behavior: 'smooth', block: 'start'});
          return;
        }
      }
    }

    // ── tabs ──
    function wireTabs(slug) {
      const tabs = document.querySelectorAll('.tab-bar button');
      const panels = document.querySelectorAll('.tab-panel');
      tabs.forEach(btn => {
        btn.addEventListener('click', () => {
          const t = btn.dataset.tab;
          // update hash without triggering route
          const newHash = '#' + slug + (t === 'artists' ? '' : ':' + t);
          if (window.location.hash !== newHash) {
            history.replaceState(null, '', newHash);
          }
          tabs.forEach(b => b.classList.remove('active'));
          panels.forEach(p => p.classList.remove('active'));
          btn.classList.add('active');
          document.querySelector('.tab-' + t).classList.add('active');
          if (t === 'artists') scrollToNow();
        });
      });
    }

    // ── locations panel ──
    function buildLocationsPanel(page) {
      const mapSrc = page.map || '';
      return '' +
        '<div class="map-toolbar" id="mapToolbar">' +
        '<button data-mode="tent">⛺ Tent</button>' +
        '<button data-mode="meet">📍 Meet</button>' +
        '<button data-mode="me">🙂 Me</button>' +
        '<button id="clearMarkers">✕ Clear</button>' +
        '</div>' +
        '<div class="map-container" id="mapContainer">' +
        '<img src="' + mapSrc + '" id="mapImg" alt="Festival map">' +
        '<div id="markersLayer"></div>' +
        '</div>' +
        '<div class="map-share-wrap"><button id="shareMap">📤 Share my map</button></div>' +
        '<p class="map-help">Select a type above, then tap the map to place or move it. Tap a marker to select it for moving. Long-press a marker to label or remove. Long-press the Me button to choose your emoji.</p>' +
        '<div class="supermarket-section">' +
          '<h3>🛒 Nearest Supermarkets</h3>' +
          '<a href="https://maps.google.com/?q=supermarket+Diepholz" target="_blank">' +
            '<img class="supermarket-map" src="appletree-2026/assets/supermarket-map.png" alt="Supermarkets near Diepholz">' +
          '</a>' +
          '<p class="supermarket-note">🎪 Alter Groweg &nbsp;|&nbsp; 🛒 Netto (closest), ALDI, Combi — dashed line shows route to nearest</p>' +
          '<p class="supermarket-note">Tap map to open directions in Google Maps</p>' +
        '</div>';
    }

    function initMap(slug, mapSrc) {
      const container = document.getElementById('mapContainer');
      const markersLayer = document.getElementById('markersLayer');
      const img = document.getElementById('mapImg');
      const toolbar = document.getElementById('mapToolbar');
      let mode = null; // null = no type selected
      const storageKey = slug + '-markers';

      // load saved markers
      let markers = [];
      try {markers = JSON.parse(localStorage.getItem(storageKey)) || [];} catch (e) { }

      const EMOJI = {tent: '⛺', meet: '📍', me: '🙂'};

      function save() {localStorage.setItem(storageKey, JSON.stringify(markers));}

      // migrate old 'here' type
      let migrated = false;
      markers.forEach(m => {if (m.type === 'here') {m.type = 'me'; migrated = true;} });
      if (migrated) save();

      function deselectMode() {
        mode = null;
        toolbar.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
      }

      function selectMode(m) {
        toolbar.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
        mode = m;
        const btn = toolbar.querySelector('[data-mode="' + m + '"]');
        if (btn) btn.classList.add('active');
      }

      function getMarkerIndex(type) {
        return markers.findIndex(m => m.type === type);
      }

      function placeOrMove(x, y) {
        if (!mode) return;
        const existing = getMarkerIndex(mode);
        if (existing >= 0) {
          markers[existing].x = Math.round(x * 10) / 10;
          markers[existing].y = Math.round(y * 10) / 10;
        } else {
          markers.push({type: mode, x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10, label: ''});
        }
        save();
        renderMarkers();
        deselectMode();
      }

      function renderMarkers() {
        markersLayer.innerHTML = '';
        markers.forEach((m, i) => {
          const el = document.createElement('span');
          el.className = 'map-marker';
          el.style.left = m.x + '%';
          el.style.top = m.y + '%';
          el.innerHTML = (EMOJI[m.type] || '📍') + (m.label ? '<span class="label">' + esc(m.label) + '</span>' : '');
          // tap existing marker to select its type for moving
          el.addEventListener('click', e => {
            e.stopPropagation();
            if (mode === m.type) {deselectMode(); return;}
            selectMode(m.type);
          });
          // long press to label or remove
          el.addEventListener('touchstart', function start(ev) {
            const timer = setTimeout(() => {
              const lbl = prompt('Label (empty to remove):', m.label || '');
              if (lbl === '') {markers.splice(i, 1); save(); renderMarkers(); return;}
              if (lbl !== null) {m.label = lbl; save(); renderMarkers();}
            }, 600);
            el.addEventListener('touchend', () => clearTimeout(timer), {once: true});
            el.addEventListener('touchmove', () => clearTimeout(timer), {once: true});
          });
          markersLayer.appendChild(el);
        });
      }

      container.addEventListener('click', e => {
        if (!mode) return;
        if (e.target.closest('.map-marker')) return;
        const rect = container.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        placeOrMove(x, y);
      });

      // toolbar type buttons
      toolbar.querySelectorAll('[data-mode]').forEach(btn => {
        btn.addEventListener('click', () => {
          const m = btn.dataset.mode;
          if (mode === m) {deselectMode(); return;}
          selectMode(m);
        });
        // long-press "Me" button to change emoji
        if (btn.dataset.mode === 'me') {
          btn.addEventListener('touchstart', function start(ev) {
            const timer = setTimeout(() => {
              const custom = prompt('Your emoji:', EMOJI.me);
              if (custom && custom.trim()) {
                EMOJI.me = custom.trim();
                localStorage.setItem(slug + '-me-emoji', EMOJI.me);
                btn.childNodes[0].textContent = EMOJI.me + ' ';
                renderMarkers();
              }
            }, 600);
            btn.addEventListener('touchend', () => clearTimeout(timer), {once: true});
            btn.addEventListener('touchmove', () => clearTimeout(timer), {once: true});
          });
        }
      });

      // load custom me-emoji
      const savedEmoji = localStorage.getItem(slug + '-me-emoji');
      if (savedEmoji) {
        EMOJI.me = savedEmoji;
        const meBtn = toolbar.querySelector('[data-mode="me"]');
        if (meBtn) meBtn.childNodes[0].textContent = EMOJI.me + ' ';
      }

      document.getElementById('clearMarkers').addEventListener('click', () => {
        if (confirm('Remove all markers?')) {markers = []; save(); renderMarkers();}
      });

      document.getElementById('shareMap').addEventListener('click', () => {
        const canvas = document.createElement('canvas');
        const nw = img.naturalWidth || img.width;
        const nh = img.naturalHeight || img.height;
        const MAX = 1200;
        const scale = Math.min(1, MAX / Math.max(nw, nh));
        const cw = Math.round(nw * scale);
        const ch = Math.round(nh * scale);
        canvas.width = cw; canvas.height = ch;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, cw, ch);
        const fontSize = Math.round(cw * 0.035);
        const labelSize = Math.round(cw * 0.016);
        markers.forEach(m => {
          const mx = (m.x / 100) * cw;
          const my = (m.y / 100) * ch;
          ctx.font = fontSize + 'px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(EMOJI[m.type] || '📍', mx, my);
          if (m.label) {
            ctx.font = labelSize + 'px sans-serif';
            const metrics = ctx.measureText(m.label);
            const tw = metrics.width;
            const th = labelSize * 1.4;
            const tx = mx - tw / 2 - labelSize * 0.4;
            const ty = my + fontSize * 0.6;
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            roundRect(ctx, tx, ty, tw + labelSize * 0.8, th, labelSize * 0.3);
            ctx.fill();
            ctx.fillStyle = '#111';
            ctx.fillText(m.label, mx, ty + labelSize);
          }
        });
        // use toDataURL to stay within the click gesture
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        const blob = dataURLtoBlob(dataUrl);
        const file = new File([blob], 'location.jpg', {type: 'image/jpeg'});
        if (navigator.share) {
          navigator.share({files: [file]}).catch((err) => {
            // file share failed, fall back to download
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'location.jpg'; a.click();
          });
        } else {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'location.jpg'; a.click();
        }
      });

      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function dataURLtoBlob(dataUrl) {
        const parts = dataUrl.split(',');
        const mime = parts[0].match(/:(.*?);/)[1];
        const bytes = atob(parts[1]);
        const buf = new Uint8Array(bytes.length);
        for (let i = 0; i < bytes.length; i++) buf[i] = bytes.charCodeAt(i);
        return new Blob([buf], {type: mime});
      }

      renderMarkers();
    }

    // ── notifications panel ──
    function buildNotificationsPanel(notifHtml) {
      return notifHtml ? '<div class="md notif-md">' + notifHtml + '</div>' : '';
    }

    function initNotifications(slug) {
      // notifications are now fully static from notifications.md
    }

    // online/offline
    window.addEventListener('online', () => {isOnline = true; toast('Back online');});
    window.addEventListener('offline', () => {isOnline = false; toast('Offline — cached pages available');});



    // ── init ──
    loadIndex().then(() => route());

    // ── register service worker ──
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => { });
    }
  </script>
