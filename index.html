<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Festival Picks">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23fff'/><text y='50' font-size='64' text-anchor='middle' x='50' dominant-baseline='central'>✊</text></svg>">
  <title>Festival TT Picks</title>
  <style>
    :root {
      --bg: #faf9f6;
      --card-bg: #fff;
      --text: #1a1a2e;
      --text-muted: #666;
      --border: #e8e4df;
      --accent: #e94560;
      --accent-soft: #fce4e8;
      --link: #2d6a9f;
      --stage-bg: #f0ede8;
      --shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a2e;
        --card-bg: #222240;
        --text: #e8e4df;
        --text-muted: #999;
        --border: #333355;
        --accent: #ff6b81;
        --accent-soft: #3a1a2e;
        --link: #7cb9e8;
        --stage-bg: #2a2a44;
        --shadow: 0 1px 3px rgba(0,0,0,.3);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    /* ── header ── */
    header {
      position: sticky; top: 0; z-index: 10;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex; align-items: center; gap: 12px;
    }
    header .back {
      width: 36px; height: 36px;
      border: none; background: var(--stage-bg);
      border-radius: 50%; font-size: 18px;
      cursor: pointer; color: var(--text);
      display: none; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    header .back.visible { display: flex; }
    header h1 { font-size: 1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── main ── */
    main { padding: 12px 16px 32px; max-width: 720px; margin: 0 auto; }

    /* ── listing ── */
    .listing { display: none; }
    .listing.active { display: block; }
    .listing h2 { font-size: .85rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); margin-bottom: 12px; }
    .card {
      display: block; padding: 14px 16px;
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px; margin-bottom: 8px;
      text-decoration: none; color: var(--text);
      box-shadow: var(--shadow);
      transition: transform .15s;
    }
    .card:active { transform: scale(.98); }
    .card .title { font-weight: 600; font-size: .95rem; }
    .card .meta { font-size: .8rem; color: var(--text-muted); margin-top: 2px; }

    /* ── content view ── */
    .content { display: none; }
    .content.active { display: block; }

    /* ── markdown rendered ── */
    .md { font-size: .9rem; }
    .md h1 { font-size: 1.2rem; margin: 0 0 16px; line-height: 1.3; }
    .md h2 { font-size: 1rem; margin: 24px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
    .md h3 { font-size: .9rem; margin: 16px 0 6px; }
    .md p { margin: 8px 0; }
    .md a { color: var(--link); text-decoration: none; }
    .md a:visited { color: var(--link); }
    .md hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

    /* ── mobile-friendly tables ── */
    .md .table-wrap {
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      margin: 8px -16px; padding: 0 16px;
      scroll-snap-type: x mandatory;
    }
    .md table {
      width: 100%; min-width: 420px;
      border-collapse: collapse; font-size: .8rem;
    }
    .md th {
      text-align: left; font-size: .7rem; text-transform: uppercase;
      letter-spacing: .04em; color: var(--text-muted);
      padding: 6px 8px; border-bottom: 2px solid var(--border);
      white-space: nowrap;
    }
    .md td {
      padding: 8px 8px; border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .md tr:last-child td { border-bottom: none; }

    /* card-style rows on narrow screens */
    @media (max-width: 520px) {
      .md .table-wrap { margin: 8px 0; padding: 0; overflow-x: visible; }
      .md table, .md thead, .md tbody, .md th, .md tr, .md td { display: block; }
      .md thead { display: none; }
      .md tr {
        background: var(--card-bg); border: 1px solid var(--border);
        border-radius: 10px; margin-bottom: 10px; padding: 10px 14px;
        box-shadow: var(--shadow);
      }
      .md td {
        border: none; padding: 4px 0; display: block; font-size: .82rem;
      }
      .md td::before {
        content: attr(data-label);
        display: block;
        font-size: .64rem; font-weight: 600; text-transform: uppercase;
        letter-spacing: .03em; color: var(--text-muted);
        margin-bottom: 1px;
      }
      .md td[data-label=""]::before { display: none; }
      .md td:first-child { font-weight: 600; font-size: .92rem; margin-bottom: 6px; }
      .md td:first-child::before { display: none; }

      /* summary column — collapsible */
      .md td.summary-cell .summary-text {
        display: block;
        max-height: 2.7em;
        overflow: hidden;
      }
      .md td.summary-cell.expanded .summary-text {
        max-height: none;
        overflow: visible;
      }
      .md td.summary-cell .summary-toggle {
        display: inline-block; font-size: .7rem; font-weight: 600;
        color: var(--link); margin-top: 2px;
        cursor: pointer; user-select: none;
        background: none; border: none; padding: 2px 0;
      }
    }

    .md blockquote {
      border-left: 3px solid var(--accent);
      margin: 12px 0; padding: 8px 14px;
      background: var(--accent-soft); border-radius: 0 8px 8px 0;
      font-size: .82rem; color: var(--text-muted);
    }
    .md code {
      background: var(--stage-bg); padding: 1px 5px;
      border-radius: 4px; font-size: .82em;
    }

    /* ── loading / offline badge ── */
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #333; color: #fff; padding: 8px 18px;
      border-radius: 20px; font-size: .78rem;
      opacity: 0; transition: opacity .3s;
      pointer-events: none; z-index: 99;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <button class="back" id="backBtn" aria-label="Back">←</button>
    <h1 id="pageTitle">Festival Picks</h1>
  </header>

  <main>
    <div class="listing active" id="listing"></div>
    <div class="content" id="content"></div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    // ── simple SPA router via hash ──
    const $listing = document.getElementById('listing');
    const $content = document.getElementById('content');
    const $backBtn = document.getElementById('backBtn');
    const $title   = document.getElementById('pageTitle');
    const $toast   = document.getElementById('toast');

    let pages = [];
    let isOnline = navigator.onLine;

    // ── toast ──
    function toast(msg, ms = 2000) {
      $toast.textContent = msg;
      $toast.classList.add('show');
      clearTimeout($toast._t);
      $toast._t = setTimeout(() => $toast.classList.remove('show'), ms);
    }

    // ── load page index ──
    async function loadIndex() {
      try {
        const res = await fetch('pages.json');
        pages = await res.json();
      } catch(e) {
        // fallback: show only if we can't load
        pages = [];
      }
      renderListing();
    }

    function renderListing() {
      $listing.innerHTML = '';
      if (pages.length === 0) {
        $listing.innerHTML = '<p style="color:var(--text-muted)">No festival pages found. Add markdown files to the repo.</p>';
        return;
      }
      const h2 = document.createElement('h2');
      h2.textContent = 'Festivals';
      $listing.appendChild(h2);

      pages.forEach((p, i) => {
        const a = document.createElement('a');
        a.className = 'card';
        a.href = '#' + p.slug;
        a.innerHTML = `<div class="title">${esc(p.title)}</div><div class="meta">${esc(p.date || '')}</div>`;
        $listing.appendChild(a);
      });
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // ── simple markdown → HTML ──
    function md2html(md) {
      let html = md;

      // preprocess: collect table blocks so we don't process pipes inside them weirdly
      // 1. headers (must be before hr)
      html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
      html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
      html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

      // 2. horizontal rules
      html = html.replace(/^---$/gm, '<hr>');

      // 3. blockquotes
      html = html.replace(/^&gt; (.*)$/gm, '<blockquote><p>$1</p></blockquote>');
      // merge consecutive blockquotes
      html = html.replace(/<\/blockquote>\n<blockquote>/g, '\n');

      // 4. inline code
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

      // 5. links
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

      // 6. bold & italic
      html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

      // 7. tables — wrap in div.table-wrap and convert
      html = html.replace(/((?:^\|.+\|$\n?)+)/gm, (match) => {
        const lines = match.trim().split('\n');
        // check for separator line
        let hasHeader = lines.length > 1 && /^\|(\s*:?-+:?\s*\|)+$/.test(lines[1]);
        let headerCells = [];
        let bodyStart = 0;

        if (hasHeader) {
          headerCells = lines[0].split('|').slice(1, -1).map(c => c.trim());
          bodyStart = 2;
        } else {
          bodyStart = 0;
        }

        let tableHtml = '<div class="table-wrap"><table>';
        if (hasHeader) {
          tableHtml += '<thead><tr>';
          headerCells.forEach(c => { tableHtml += `<th>${c}</th>`; });
          tableHtml += '</tr></thead>';
        }

        tableHtml += '<tbody>';
        for (let i = bodyStart; i < lines.length; i++) {
          const cells = lines[i].split('|').slice(1, -1).map(c => c.trim());
          if (cells.length === 0 || cells.every(c => c === '')) continue;
          tableHtml += '<tr>';
          cells.forEach((c, ci) => {
            const label = hasHeader && headerCells[ci] ? headerCells[ci] : '';
            const isLast = ci === cells.length - 1;
            let cls = isLast ? ' class="summary-cell"' : '';
            let inner = c;
            if (isLast) {
              inner = `<span class="summary-text">${c}</span><button class="summary-toggle">⋯ more</button>`;
            }
            tableHtml += `<td data-label="${escAttr(label)}"${cls}>${inner}</td>`;
          });
          tableHtml += '</tr>';
        }
        tableHtml += '</tbody></table></div>';
        return tableHtml;
      });

      // 8. paragraphs — wrap remaining text lines in <p>
      // split by double newlines, then process
      const blocks = html.split(/\n\n+/);
      html = blocks.map(block => {
        block = block.trim();
        if (!block) return '';
        // skip blocks that are already html tags
        if (/^<(h[1-4]|hr|blockquote|div|table|thead|tbody|tr|th|td|ul|ol|li|p|pre|code)/.test(block)) return block;
        // skip single <br> or empty
        if (block === '<br>') return block;
        // wrap in p
        const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
        return '<p>' + lines.join('<br>') + '</p>';
      }).join('\n');

      return html;
    }

    function escAttr(s) {
      return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── load & render a page ──
    async function loadPage(slug) {
      const page = pages.find(p => p.slug === slug);
      if (!page) { showListing(); return; }

      $listing.classList.remove('active');
      $content.classList.add('active');
      $backBtn.classList.add('visible');
      $title.textContent = page.title;
      $content.innerHTML = '<p style="color:var(--text-muted)">Loading…</p>';

      try {
        const res = await fetch(page.file);
        if (!res.ok) throw new Error('Not found');
        const md = await res.text();
        const html = md2html(md);
        $content.innerHTML = '<div class="md">' + html + '</div>';
        // save to cache for offline via service worker
      } catch(e) {
        $content.innerHTML = '<p style="color:var(--text-muted)">Failed to load page. Check your connection.</p>';
      }
    }

    function showListing() {
      $content.classList.remove('active');
      $listing.classList.add('active');
      $backBtn.classList.remove('visible');
      $title.textContent = 'Festival Picks';
      window.location.hash = '';
    }

    // ── routing ──
    function route() {
      const hash = window.location.hash.replace('#', '');
      if (hash && pages.length > 0) {
        loadPage(hash);
      } else if (hash && pages.length === 0) {
        // pages not loaded yet, retry
        loadIndex().then(() => { if (window.location.hash) route(); });
      } else {
        showListing();
      }
    }

    $backBtn.addEventListener('click', showListing);
    window.addEventListener('hashchange', route);

    // online/offline
    window.addEventListener('online', () => { isOnline = true; toast('Back online'); });
    window.addEventListener('offline', () => { isOnline = false; toast('Offline — cached pages available'); });

    // ── summary toggle (delegated) ──
    document.addEventListener('click', e => {
      const btn = e.target.closest('.summary-toggle');
      if (!btn) return;
      const cell = btn.closest('.summary-cell');
      const expanded = cell.classList.toggle('expanded');
      btn.textContent = expanded ? '▲ less' : '⋯ more';
    });

    // ── init ──
    loadIndex().then(() => route());

    // ── register service worker ──
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
